info:
  name: Create Vehicle
  type: http
  seq: 1

http:
  method: POST
  url: http://127.0.0.1:5000/vehicles/
  body:
    type: json
    data: |-
      {
        "license_plate": "ABC123",
        "model": "Ford Transit"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
